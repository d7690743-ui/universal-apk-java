plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hex.factory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hex.universalapk'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }

    signingConfigs {
        release {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (path != null) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH') != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}